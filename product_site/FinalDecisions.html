        <link href = "css/main.css" type = "text/css" rel="stylesheet" />
        <link href = "css/Final.css" type = "text/css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TNRC49V4"></script>

    <body>
        <!--this is the top part of the website where the user sees the logo-->
        <img src="images/clear_logo.png" alt="Interstellar Planning Logo" width="375" height="200">

        <div class = "header">
        <div>
        <a href="MainHub.html"><strong>Main Hub</strong></a>
        <a href="Dreamdate.html"><strong>Dream Date</strong></a>
        <a href="Dreamconditions.html"><strong>Dream Weather Conditions</strong></a>
        <a href="Dreamaccomodations.html"><strong>Dream Accomodations</strong></a>
        <a href="FinalDecisions.html" class="active">Dream Vacation</a>
        </div>
        </div>
        
        <table id = "vacationtable">
            <tr>
                <td class = "Finaltable">Date (Milky Way)</td>
                <td class = "Finaltable">Weather Conditions</td>
                <td class = "Finaltable">Accomodations</td>
                <td class = "Finaltable">Price</td>
                <td class = "Finaltable actioncell"></td>
            </tr>
            <tr class = "vacationrow">
                <td class = "Finaltable"><span id = "datepicked">Not Selected Yet...</span></td>
                <td class = "Finaltable"><span id = "conditionspicked">Not Selected Yet...</span></td>
                <td class = "Finaltable"><span id = "accompicked">Not Selected Yet</span></td>
                <td class = "Finaltable"><span id = "pricepicked">Not Accumulated Yet</span></td>
                <td class = "Finaltable actioncell">
                    <div class = "hovericons">
                        <span class = "plusicon" title = "Create Another Section">➕</span>
                        <span class = "rocketicon" title = "Send Details to Email">🚀</span>
                        <span class = "trashicon" title = "Delete Data">🗑️</span>
                    </div>
                </td>
            </tr>
        </table>

        <div id = "emailsection">
            <form id = "emailform">
                <label for = "emailinput">Enter your preferred email:</label>
                <input type = "email" id = "emailinput" />
                <button type = "submit" id = "emailsubmit">Submit</button>

            </form>
        </div>
